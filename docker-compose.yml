services:
  postgres:
    image: postgres:16-alpine
    container_name: lumo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: LumoHBK90.
      POSTGRES_DB: lumo_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d desktop_rbac"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
